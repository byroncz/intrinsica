<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viz-render" content="@@RENDER_META@@">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>viz · día</title>
<style>
@@UPLOT_CSS@@
@@STYLE_CSS@@
</style>
</head>
<body>
<header id="status">
  <span class="item"><span class="label">Día</span> <b id="s-day">…</b> <span class="label">UTC</span></span>
  <span class="item">
    <label class="label" for="theta">θ</label>
    <select id="theta" aria-label="θ activo"></select>
  </span>
  <span class="item" id="nav">
    <button type="button" id="ev-prev" disabled>Evento anterior</button>
    <button type="button" id="ev-next" disabled>Evento siguiente</button>
    <button type="button" id="ev-fit" disabled>Ajustar a la ventana</button>
    <span id="ev-info" class="label"></span>
  </span>
  <span class="item"><span class="label">Actualizado</span> <b id="s-updated">…</b></span>
  <span class="item" id="s-data-box"><span class="label">Datos</span> <b id="s-data">…</b></span>
</header>
<main id="panels">
  <div id="price"></div>
  <div id="confirms"></div>
  <div id="volume"></div>
</main>
<footer id="hint">
  <span id="f-view"></span>
  <span id="legend" role="group" aria-label="Leyenda">
    <span class="key" title="Alza, confirmación: relleno tenue y franja fina arriba" aria-label="Alza, confirmación"><i class="sw up conf"></i></span>
    <span class="key" title="Alza, overshoot: relleno intenso y franja gruesa arriba" aria-label="Alza, overshoot"><i class="sw up over"></i></span>
    <span class="key" title="Baja, confirmación: relleno tenue y franja fina abajo" aria-label="Baja, confirmación"><i class="sw down conf"></i></span>
    <span class="key" title="Baja, overshoot: relleno intenso y franja gruesa abajo" aria-label="Baja, overshoot"><i class="sw down over"></i></span>
    <span class="key" title="Confirmación de un evento al alza" aria-label="Línea de confirmación, alza"><i class="ln up"></i></span>
    <span class="key" title="Confirmación de un evento a la baja" aria-label="Línea de confirmación, baja"><i class="ln down"></i></span>
    <span class="key" title="Precio: un punto por tick o el segmento del mínimo al máximo de cada píxel" aria-label="Precio"><i class="mk price"></i></span>
    <span class="key" title="Eventos enteros dentro del mismo píxel: la marca cuenta cuántos" aria-label="Eventos enteros dentro del mismo píxel"><i class="sw dense"></i><b class="num">12 eventos</b></span>
    <span class="key" title="Cola provisional: el extremo es un candidato vigente" aria-label="Cola provisional"><i class="ln prov"></i></span>
    <span class="key" title="θ que confirman en el píxel (barra) y máximo en el mismo instante (marca intensa)" aria-label="θ que confirman"><i class="bar both"></i></span>
    <span class="key" title="Volumen: suma de la cantidad de los ticks del píxel" aria-label="Volumen"><i class="bar vol"></i></span>
  </span>
  <span id="f-help">arrastrar: ampliar · doble clic o Esc: día completo</span>
</footer>
<div id="tip" hidden></div>
<noscript><p class="nojs">Esta página necesita JavaScript para dibujar el día.</p></noscript>
<script>
@@UPLOT_JS@@
</script>
<script id="viz-data">
window.VIZ_DATA=@@VIZ_DATA@@;
</script>
<script>
@@APP_JS@@
</script>
</body>
</html>

[project]
name = "l2_dc_events"
version = "0.1.0"
description = "Capa L2 de intrinsica: eventos Directional Change de 50 theta sobre la landing de L1."
requires-python = ">=3.14"
dependencies = [
    "dc_pyo3",
    "dq",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.sources]
dc_pyo3 = { workspace = true }
dq = { workspace = true }

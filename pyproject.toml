[project]
name = "intrinsica"
version = "0.0.0"
description = "Motor de análisis Directional Change (DC) para mercados financieros."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["dc_frames", "dc_pyo3", "dq[reader]", "l1_ingest", "l2_dc_events", "l3_dc_descriptors", "ops_tools", "viz_tiles"]

[dependency-groups]
dev = [
    "polars>=1.44.2",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
dc_frames = { workspace = true }
dq = { workspace = true }
l1_ingest = { workspace = true }
l2_dc_events = { workspace = true }
l3_dc_descriptors = { workspace = true }
ops_tools = { workspace = true }
viz_tiles = { workspace = true }
dc_pyo3 = { workspace = true }

[tool.uv.workspace]
members = ["shared/*", "layers/*"]
# dc_core y dc_descriptors son crates Rust, sin pyproject.toml: un directorio
# sin manifiesto bajo shared/ rompe el workspace de uv (shared/README.md).
# dc_pyo3 sí lo tiene: maturin lo construye.
exclude = ["shared/dc_core", "shared/dc_descriptors"]

[tool.ruff]
line-length = 88
extend-exclude = ["scaffold"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
# El lago sintético del lector (`frames_lake`) también es el de las pruebas de L3.
pythonpath = ["shared/dc_frames/tests"]
testpaths = [
    "tests",
    "shared/dc_frames/tests",
    "shared/dq/tests",
    "shared/pyutils/tests",
    "shared/dc_pyo3/tests",
    "layers/l1_ingest/tests",
    "layers/l2_dc_events/tests",
    "layers/l3_dc_descriptors/tests",
    "layers/ops_tools/tests",
    "layers/viz_tiles/tests",
]

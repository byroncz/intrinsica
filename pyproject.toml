[project]
name = "intrinsica"
version = "0.0.0"
description = "Motor de análisis Directional Change (DC) para mercados financieros."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["dq[reader]", "l1_ingest"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
dq = { workspace = true }
l1_ingest = { workspace = true }

[tool.uv.workspace]
members = ["shared/*", "layers/*"]
# dc_core es un crate Rust, sin pyproject.toml: un directorio sin manifiesto
# bajo shared/ rompe el workspace de uv (shared/README.md).
exclude = ["shared/dc_core"]

[tool.ruff]
line-length = 88
extend-exclude = ["scaffold"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests", "shared/dq/tests", "layers/l1_ingest/tests"]

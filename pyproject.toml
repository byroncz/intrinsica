[project]
name = "intrinsica"
version = "0.0.0"
description = "Motor de análisis Directional Change (DC) para mercados financieros."
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["dq[reader]"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.uv.sources]
dq = { workspace = true }

[tool.uv.workspace]
members = ["shared/*", "layers/*"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
testpaths = ["tests", "shared/dq/tests"]

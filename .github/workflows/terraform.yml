# Terraform de los stacks de capa, en tres caminos:
# - PR: fmt, validate y plan informativo de los afectados. Nunca aplica.
# - Merge a main (workflow_run): cuando CI termina en verde sobre un push a main,
#   plan de los stacks afectados y un apply por stack que espera la aprobación del
#   humano en el environment gcp. Va tras CI porque la imagen con el tag nuevo
#   (layers/<capa>/VERSION) solo se publica allí: aplicar antes falla con "tag no existe".
# - Manual (workflow_dispatch): apply o destroy de un stack sin cambio de código.
# Merge y manual comparten _terraform-stack.yml: plan sin aprobación, apply del
# mismo plan guardado con aprobación. `data` nunca entra: lo aplica el humano.
name: Terraform

# En un run por merge, el título es el del commit que despliega (con varios en
# espera, el humano aprueba el más reciente).
run-name: >-
  ${{ github.event_name == 'workflow_run'
  && format('Deploy: {0}', github.event.workflow_run.display_title)
  || github.event.pull_request.title
  || 'Terraform' }}

on:
  pull_request:
    paths:
      - "infra/**"
      - "layers/*/VERSION" # el stack de la capa deriva el tag de la imagen de este archivo
      - ".github/workflows/terraform.yml"
      - ".github/workflows/_terraform-stack.yml"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      stack:
        description: Stack de capa (la rama la elige el botón de GitHub)
        type: choice
        options:
          - l1
          - l2
          - l3
          - l4
          - alerting
          - ops
        required: true
      action:
        description: Acción de Terraform
        type: choice
        options:
          - apply
          - destroy
        required: true

env:
  CHECKPOINT_DISABLE: "1"

jobs:
  # Calcula los stacks de capa afectados. `data` nunca entra: lo aplica el humano.
  changes:
    # En workflow_run solo cuenta un push a main de este repo con CI en verde.
    if: >-
      github.event_name == 'pull_request'
      || (github.event_name == 'workflow_run'
      && github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }} # vacío en un PR: el checkout por defecto

      - name: Calcular matriz de stacks
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="${BASE_SHA}...HEAD"
          else
            # Push a main: el commit contra su primer padre. Cubre un squash o un
            # merge commit; un rebase merge de varios commits se despliega a mano.
            range="${HEAD_SHA}^1..${HEAD_SHA}"
          fi
          changed="$(git diff --name-only "$range")"
          layers="$(find infra/stacks/batch -mindepth 1 -maxdepth 1 -type d ! -name data -printf '%f\n' | sort)"
          if grep -qE '^(infra/modules/|\.github/workflows/(_terraform-stack|terraform)\.yml$)' <<< "$changed"; then
            selected="$layers"
          else
            # layers/<capa>/VERSION -> stack <capa> sin el sufijo (l1_ingest -> l1)
            stacks="$( { grep -E '^infra/stacks/batch/[^/]+/' <<< "$changed" | cut -d/ -f4; \
              grep -E '^layers/[^/]+/VERSION$' <<< "$changed" | cut -d/ -f2 | cut -d_ -f1; } | sort -u)"
            selected="$(grep -Fxf <(echo "$layers") <<< "$stacks" || true)"
          fi
          matrix="$(jq -Rsc 'split("\n") | map(select(. != ""))' <<< "$selected")"
          echo "matrix=${matrix}" | tee -a "$GITHUB_OUTPUT"

  stack:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write # WIF: el token OIDC de GitHub se canjea por credenciales de GCP
    env:
      STACK_DIR: infra/stacks/batch/${{ matrix.layer }}
      # Plan solo si WIF ya está configurado (tras aplicar deploy-github).
      PLAN: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT != '' }}
      # El plan de un PR nunca usa el correo real: el stack alerting lleva un
      # relleno (la variable es sensible, no se imprime) y el valor real, el
      # secret ALERT_EMAIL, solo entra en el job plan que sigue a un merge.
      TF_VAR_alert_email: plan@example.invalid
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.4 # misma versión que infra/bin/install-terraform.sh
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra/

      - name: terraform init (sin backend)
        run: terraform -chdir="$STACK_DIR" init -backend=false -input=false

      - name: terraform validate
        run: terraform -chdir="$STACK_DIR" validate

      - name: Autenticar en GCP (WIF, sin llaves)
        if: env.PLAN == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: terraform init (backend GCS)
        if: env.PLAN == 'true'
        run: |
          terraform -chdir="$STACK_DIR" init -reconfigure -input=false \
            -backend-config="bucket=${{ vars.GCP_PROJECT_ID }}-tfstate"

      - name: terraform plan
        if: env.PLAN == 'true'
        run: |
          set -o pipefail
          terraform -chdir="$STACK_DIR" plan -input=false -no-color \
            -var "tfstate_bucket=${{ vars.GCP_PROJECT_ID }}-tfstate" | tee "$RUNNER_TEMP/plan.txt"

      # Se publica aunque el plan falle; el paso anterior ya deja el check en rojo.
      - name: Publicar plan en el resumen
        if: always() && env.PLAN == 'true'
        run: |
          {
            echo "## terraform plan: ${{ matrix.layer }}"
            echo '```'
            cat "$RUNNER_TEMP/plan.txt" 2>/dev/null || echo "(sin salida)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Merge a main: plan de cada stack afectado y, si hay cambios, un apply que
  # espera la aprobación del humano en el environment gcp. Cada stack va por su
  # cuenta (el plan fallido de uno no frena a los demás). Se omite mientras WIF
  # no esté configurado, igual que el plan de los PR.
  deploy:
    needs: changes
    if: github.event_name == 'workflow_run' && needs.changes.outputs.matrix != '[]' && vars.GCP_DEPLOY_SERVICE_ACCOUNT != ''
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write # WIF: el token OIDC de GitHub se canjea por credenciales de GCP
    uses: ./.github/workflows/_terraform-stack.yml
    with:
      stack: ${{ matrix.layer }}
      action: apply
      ref: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit # ALERT_EMAIL, para el plan del stack alerting

  # Camino manual: reaplicar sin cambio de código (cerrar deriva) o destroy. `data`
  # no está entre las opciones y lo aplica el humano.
  manual:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write # WIF: el token OIDC de GitHub se canjea por credenciales de GCP
    uses: ./.github/workflows/_terraform-stack.yml
    with:
      stack: ${{ inputs.stack }}
      action: ${{ inputs.action }}
      ref: ${{ github.sha }}
    secrets: inherit # ALERT_EMAIL, para el plan del stack alerting

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run manual en main: construye y publica todas las capas

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uvx yamllint .
      - run: .github/scripts/check-workflow-yaml.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show # ubuntu-latest ya trae rustup; lee rust-toolchain.toml sola
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Decide qué capas construir. Una capa se construye si cambió layers/<capa>/**;
  # todas se construyen si cambió shared/**, uv.lock, pyproject.toml o .github/workflows/**
  # (o en un run manual): el Dockerfile copia el lock y pyproject a la imagen.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      # ÚNICO lugar donde se declaran las capas (JSON). Para agregar una capa:
      # añade su nombre aquí (por ejemplo '["l1_ingest","l2_dc_events"]') y
      # crea layers/<capa>/Dockerfile y layers/<capa>/VERSION. El filtro y la
      # matriz se derivan de esta lista; no hay nada más que editar.
      LAYERS: '["l1_ingest","l2_dc_events","ops_tools","viz_tiles"]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # la guardia de VERSION compara contra la base del PR

      # Todo cambio de código de una capa debe subir su VERSION: el tag de la
      # imagen y el stack de la capa se derivan de ella (ITSC-216).
      - name: Exigir VERSION nueva si cambió código de una capa
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-layer-versions.sh "origin/${{ github.base_ref }}" "$LAYERS"

      - name: Generar filtros por capa
        run: |
          {
            echo "shared:"
            echo "  - 'shared/**'"
            echo "  - 'uv.lock'"
            echo "  - 'pyproject.toml'"
            echo "  - '.github/workflows/**'"
            jq -r '.[] | "\(.):\n  - '"'"'layers/\(.)/**'"'"'"' <<< "$LAYERS"
          } > "$RUNNER_TEMP/filters.yml"
          cat "$RUNNER_TEMP/filters.yml"

      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ runner.temp }}/filters.yml

      - name: Calcular matriz de capas
        id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          matrix="$(jq -cn --argjson layers "$LAYERS" --argjson changed "$CHANGED" --arg all "$ALL" '
            if $all == "true" or ($changed | index("shared")) then $layers
            else $layers | map(select(. as $l | $changed | index($l)))
            end')"
          echo "matrix=${matrix}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-layer.yml
    with:
      layer: ${{ matrix.layer }}

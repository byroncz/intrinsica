name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # run manual en main: construye y publica todas las capas

jobs:
  # lint y test son jobs aparte (ITSC-428): el nombre del check dice qué falló,
  # un fallo de pruebas no esconde el lint de YAML y ruff no espera a pytest.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uvx yamllint .
      - run: .github/scripts/check-workflow-yaml.sh

  # Las pruebas corren por grupo (ITSC-430): un check rojo dice en qué grupo
  # falló y «Re-run failed jobs» repite solo ese grupo y el job final.
  # `groups` calcula los grupos desde testpaths de pyproject.toml (nada escrito
  # a mano): cada layers/<capa>/tests es el grupo <capa>; todo lo demás es el
  # grupo shared. Una ruta nueva en testpaths cae sola en su grupo.
  groups:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Armar la matriz de grupos desde testpaths
        id: matrix
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import json, re, tomllib

          with open("pyproject.toml", "rb") as f:
              testpaths = tomllib.load(f)["tool"]["pytest"]["ini_options"]["testpaths"]
          groups = {}
          for path in testpaths:
              m = re.fullmatch(r"layers/([^/]+)/tests", path)
              groups.setdefault(m.group(1) if m else "shared", []).append(path)
          include = [{"group": g, "paths": " ".join(p)} for g, p in groups.items()]
          # Cada ruta de testpaths cae en exactamente un grupo.
          assert sorted(sum(groups.values(), [])) == sorted(testpaths)
          print(json.dumps(include, indent=2))
          print("matrix=" + json.dumps({"include": include}))
          PY

  test-group:
    name: test (${{ matrix.group }})
    needs: groups
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # un grupo rojo no cancela a los demás
      matrix: ${{ fromJSON(needs.groups.outputs.matrix) }}
    env:
      PATHS: ${{ matrix.paths }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked
      - run: uv run pytest $PATHS

  # Check requerido de main (conserva el nombre `test`). Corre siempre y exige
  # success de `groups` y de cada grupo: para GitHub un job omitido o cancelado
  # pasa como aprobado, así que aquí cualquier resultado distinto de success
  # es fallo.
  test:
    needs: [groups, test-group]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Exigir success en groups y en todos los grupos
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          jq -e 'to_entries | all(.value.result == "success")' <<< "$NEEDS" > /dev/null

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup show # ubuntu-latest ya trae rustup; lee rust-toolchain.toml sola
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # Decide qué capas construir. Una capa se construye si cambió layers/<capa>/**;
  # todas se construyen si cambió shared/**, uv.lock, pyproject.toml o .github/workflows/**
  # (o en un run manual): el Dockerfile copia el lock y pyproject a la imagen.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      # ÚNICO lugar donde se declaran las capas (JSON). Para agregar una capa:
      # añade su nombre aquí (por ejemplo '["l1_ingest","l2_dc_events"]') y
      # crea layers/<capa>/Dockerfile y layers/<capa>/VERSION. El filtro y la
      # matriz se derivan de esta lista; no hay nada más que editar.
      LAYERS: '["l1_ingest","l2_dc_events","l3_dc_descriptors","ops_tools","viz_tiles"]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # la guardia de VERSION compara contra la base del PR

      - name: Probar la guardia de VERSION
        if: github.event_name == 'pull_request'
        run: .github/scripts/test-check-layer-versions.sh

      # Todo cambio de código de una capa debe subir su VERSION: el tag de la
      # imagen y el stack de la capa se derivan de ella (ITSC-216).
      - name: Exigir VERSION nueva si cambió código de una capa
        if: github.event_name == 'pull_request'
        run: .github/scripts/check-layer-versions.sh "origin/${{ github.base_ref }}" "$LAYERS"

      - name: Generar filtros por capa
        run: |
          {
            echo "shared:"
            echo "  - 'shared/**'"
            echo "  - 'uv.lock'"
            echo "  - 'pyproject.toml'"
            echo "  - '.github/workflows/**'"
            jq -r '.[] | "\(.):\n  - '"'"'layers/\(.)/**'"'"'"' <<< "$LAYERS"
          } > "$RUNNER_TEMP/filters.yml"
          cat "$RUNNER_TEMP/filters.yml"

      - id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v4
        with:
          filters: ${{ runner.temp }}/filters.yml

      - name: Calcular matriz de capas
        id: matrix
        env:
          CHANGED: ${{ steps.filter.outputs.changes || '[]' }}
          ALL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          matrix="$(jq -cn --argjson layers "$LAYERS" --argjson changed "$CHANGED" --arg all "$ALL" '
            if $all == "true" or ($changed | index("shared")) then $layers
            else $layers | map(select(. as $l | $changed | index($l)))
            end')"
          echo "matrix=${matrix}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        layer: ${{ fromJSON(needs.changes.outputs.matrix) }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_build-layer.yml
    with:
      layer: ${{ matrix.layer }}

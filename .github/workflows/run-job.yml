# Ejecución manual de un Cloud Run Job, genérica para todas las capas. Hay un
# job por modo (<capa>-<modo>); el modo se deriva del nombre del job. Corre el
# workflow de la rama elegida en el botón.
#
# L1 lanza una tarea por unidad del rango (mes o día, según el modo); cada
# tarea toma from + CLOUD_RUN_TASK_INDEX, porque sus meses son independientes.
#
# L2 no usa task array: sus meses son secuenciales (cada mes lee el carry-over
# que escribió el anterior), y paralelizarlos rompería esa cadena. l2-backfill
# va en una sola tarea que recorre el rango completo en orden y reanuda donde
# quedó; l2-monthly procesa un mes. Por eso run-job-tasks.sh devuelve una sola
# unidad para los jobs l2 y el workflow lanza --tasks 1.
#
# ops-script (ITSC-298) no es una capa de datos: corre un script Python de
# gs://<proyecto>-ops/scripts/ (input script, con args libres en args) y deja
# en el resumen su URI, generation, hash, contenido y las últimas líneas de su
# salida. Una sola tarea; no admite from, to, force ni series_start. Los demás
# jobs ignoran script y args.
#
# Regla: no lanzar a mano el mismo mes y modo que Scheduler esté ejecutando.
name: Run job

on:
  workflow_dispatch:
    inputs:
      job:
        description: Cloud Run Job a ejecutar
        type: choice
        options:
          - l1-backfill
          - l1-daily
          - l1-monthly-close
          - l1-seam-check
          - l2-backfill
          - l2-monthly
          - ops-script
        required: true
      from:
        description: "Inicio: YYYY-MM (backfill, monthly, monthly-close) o YYYY-MM-DD (l1-daily). Solo l2-backfill admite vacío: la frontera de cada θ decide desde dónde avanza"
        type: string
        required: false
      to:
        description: "Fin inclusivo, mismo formato que from. Por defecto, igual a from; l2-monthly no admite otro valor. Excepción l2-backfill: vacío = hasta el último mes cerrado de L1; to = from = un solo mes"
        type: string
        required: false
      force:
        description: "Reprocesar aunque ya esté hecho. L1: el .CHECKSUM coincide con el manifiesto (úsalo si cambió el código). L2 (backfill): arrancar en from aunque los meses ya tengan carry-over; exige from"
        type: boolean
        default: false
      series_start:
        description: "Solo L2: primer mes de la serie, YYYY-MM (vacío: la CLI usa L2_SERIES_START del stack)"
        type: string
        required: false
      script:
        description: "Solo ops-script (obligatorio ahí): URI del script, gs://<proyecto>-ops/scripts/<nombre>.py"
        type: string
        required: false
      args:
        description: "Solo ops-script: argumentos del script, como en un shell (comillas para los que llevan espacios)"
        type: string
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment: gcp
    permissions:
      contents: read
      id-token: write # WIF: el token OIDC de GitHub se canjea por credenciales de GCP
    env:
      JOB: ${{ inputs.job }}
      FROM: ${{ inputs.from }}
      TO: ${{ inputs.to }}
      FORCE: ${{ inputs.force }}
      SERIES_START: ${{ inputs.series_start }}
      SCRIPT: ${{ inputs.script }}
      SCRIPT_ARGS: ${{ inputs.args }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Contar las tareas del rango
        id: tasks
        run: |
          # La CLI de L1 no define --series-start: argparse saldría con 2 dentro
          # de Cloud Run y gastaría una ejecución.
          if [[ -n "$SERIES_START" && "$JOB" != l2-* ]]; then
            echo "::error::series_start solo aplica a los jobs l2-*, no a $JOB"
            exit 1
          fi
          # ops-script no tiene rango ni reproceso: aceptar estos inputs
          # escondería un error de quien lanza.
          if [[ "$JOB" == ops-script && ( -n "$SERIES_START" || "$FORCE" == "true" ) ]]; then
            echo "::error::series_start y force no aplican a ops-script"
            exit 1
          fi
          if [[ "$FORCE" == "true" && -z "$FROM" ]]; then
            echo "::error::force exige from: sin él reprocesaría toda la serie"
            exit 1
          fi
          units="$(.github/scripts/run-job-tasks.sh "$JOB" "$FROM" "$TO" "$SCRIPT")" || {
            echo "::error::Rango inválido, ver el mensaje anterior"
            exit 1
          }
          echo "tasks=$(wc -l <<< "$units")" >> "$GITHUB_OUTPUT"
          echo "Unidades:"
          echo "$units"

      - name: Autenticar en GCP (WIF, sin llaves)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ejecutar el job y esperar
        id: execute
        env:
          TASKS: ${{ steps.tasks.outputs.tasks }}
        run: |
          # run-job-args.sh arma los argumentos (ITSC-292). Semántica de to:
          # en L1 y l2-monthly se omite si es igual a from (la CLI asume
          # to = from; la de l2-monthly rechaza --to). En l2-backfill siempre
          # se pasa: to vacío = hasta el último mes cerrado de L1; to = from =
          # un solo mes.
          # Para ops-script devuelve --script y --script-args con el separador
          # ;; de gcloud, porque el texto libre puede llevar comas.
          args="$(.github/scripts/run-job-args.sh "$JOB" "$FROM" "$TO" "$FORCE" "$SERIES_START" "$SCRIPT" "$SCRIPT_ARGS")"
          # --args reemplaza los argumentos del contenedor, no el ENTRYPOINT.
          # Con --format, gcloud imprime el nombre de la ejecución al terminar.
          inicio="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          set +e
          execution="$(gcloud run jobs execute "$JOB" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --wait --tasks "$TASKS" --args="$args" \
            --format='value(metadata.name)')"
          status=$?
          set -e
          if [[ -z "$execution" ]]; then
            # Si la ejecución falló, gcloud no imprime el nombre: toma la más reciente
            # creada desde $inicio. Si no hay ninguna, nunca se creó y name queda vacío.
            execution="$(gcloud run jobs executions list --job "$JOB" \
              --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
              --filter="metadata.creationTimestamp>=${inicio}" \
              --sort-by='~metadata.creationTimestamp' --limit 1 \
              --format='value(metadata.name)')"
          fi
          echo "name=${execution}" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Logs de la ejecución
        if: always() && steps.execute.outputs.name != ''
        env:
          EXECUTION: ${{ steps.execute.outputs.name }}
        run: |
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\" AND labels.\"run.googleapis.com/execution_name\"=\"${EXECUTION}\"" \
            --project "$GCP_PROJECT_ID" --order=asc --freshness=7d \
            --format='value(timestamp,severity,textPayload,jsonPayload.message)'

      - name: Resumen de la ejecución
        if: always() && steps.execute.outputs.name != ''
        env:
          EXECUTION: ${{ steps.execute.outputs.name }}
        run: |
          gcloud run jobs executions describe "$EXECUTION" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json |
            jq -r '
              (.status.conditions // [] | map(select(.type == "Completed")) | first) as $done
              | "### \(.metadata.name)",
                "",
                "| Campo | Valor |",
                "| --- | --- |",
                "| Estado | \(if $done.status == "True" then "Exitosa" elif $done.status == "False" then "Fallida" else "En curso" end) |",
                "| Tareas completadas | \(.status.succeededCount // 0) |",
                "| Tareas fallidas | \(.status.failedCount // 0) |",
                "| Inicio | \(.status.startTime // "-") |",
                "| Fin | \(.status.completionTime // "-") |"
            ' >> "$GITHUB_STEP_SUMMARY"

          # Hallazgos de DQ de cualquier capa (ITSC-295): dq.emit_findings deja
          # cada uno como una línea de log JSON; se leen de Cloud Logging con el
          # mismo filtro por execution_name que el paso anterior, sin tocar el
          # bucket de hallazgos.
          echo >> "$GITHUB_STEP_SUMMARY"
          if ! lines="$(gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\" AND labels.\"run.googleapis.com/execution_name\"=\"${EXECUTION}\" AND (textPayload:\"\\\"check_type\\\"\" OR jsonPayload.message:\"\\\"check_type\\\"\")" \
            --project "$GCP_PROJECT_ID" --order=asc --freshness=7d \
            --format='value(textPayload,jsonPayload.message)')"; then
            echo "::warning::No se pudieron leer los hallazgos de Cloud Logging"
            lines=""
          fi
          .github/scripts/findings-summary.sh <<< "$lines" >> "$GITHUB_STEP_SUMMARY"

          # ops-script (ITSC-298): identidad del script, su contenido y las
          # últimas líneas de su salida, de las líneas de log que imprime el
          # entrypoint. Cloud Logging puede tardar unos segundos tras el fin de
          # la ejecución: se reintenta hasta ver el código de salida del script.
          if [[ "$JOB" == ops-script ]]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            lines=""
            for attempt in 1 2 3 4; do
              lines="$(gcloud logging read \
                "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${JOB}\" AND labels.\"run.googleapis.com/execution_name\"=\"${EXECUTION}\"" \
                --project "$GCP_PROJECT_ID" --order=asc --freshness=7d \
                --format='value(textPayload,jsonPayload.message)')" || lines=""
              grep -q '^OPS_SCRIPT_EXIT ' <<< "$lines" && break
              sleep 10
            done
            .github/scripts/ops-summary.sh <<< "$lines" >> "$GITHUB_STEP_SUMMARY"
          fi

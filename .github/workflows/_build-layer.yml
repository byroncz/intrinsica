# Workflow reutilizable: construye la imagen de una capa y, solo en push a
# main, la publica en Artifact Registry. Lo llama el job `build` de ci.yml.
name: Build layer

on:
  workflow_call:
    inputs:
      layer:
        description: Nombre de la carpeta en layers/ (por ejemplo l1_ingest)
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF: el token OIDC de GitHub se canjea por credenciales de GCP
    env:
      LAYER: ${{ inputs.layer }}
      REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
      # Publica solo en push a main y si WIF ya está configurado (tras el primer apply).
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer versión y host del registro
        id: version
        run: |
          version="$(tr -d '[:space:]' < "layers/${LAYER}/VERSION")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::layers/${LAYER}/VERSION debe contener un semver X.Y.Z, tiene '${version}'"
            exit 1
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"
          echo "host=${REGISTRY%%/*}" >> "$GITHUB_OUTPUT"

      - name: Autenticar en GCP (WIF, sin llaves)
        id: auth
        if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Login en Artifact Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.version.outputs.host }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Construir${{ env.PUBLISH == 'true' && ' y publicar' || '' }} la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: layers/${{ inputs.layer }}/Dockerfile
          push: ${{ env.PUBLISH == 'true' }}
          # Sin publicar, la imagen queda en el daemon para la prueba de humo.
          load: ${{ env.PUBLISH != 'true' }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ vars.GCP_ARTIFACT_REGISTRY || 'local' }}/${{ inputs.layer }}:${{ steps.version.outputs.value }}
            ${{ vars.GCP_ARTIFACT_REGISTRY || 'local' }}/${{ inputs.layer }}:${{ github.sha }}

      # Si la capa trae layers/<capa>/smoke.sh, corre un día real en el contenedor.
      - name: Humo de la imagen
        if: env.PUBLISH != 'true' && hashFiles(format('layers/{0}/smoke.sh', inputs.layer)) != ''
        run: layers/${{ inputs.layer }}/smoke.sh "${{ vars.GCP_ARTIFACT_REGISTRY || 'local' }}/${{ inputs.layer }}:${{ steps.version.outputs.value }}"
